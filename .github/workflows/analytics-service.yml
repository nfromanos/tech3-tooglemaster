name: analytics-service CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: analytics-service
    VALUES_PATH: gitops/ArgoCD/workloads/analytics-service/values.yaml

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./analytics-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ./analytics-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build / compile
        run: python -m compileall .

      - name: Unit tests
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest -v
          else
            echo "No Python unit tests found; skipping test execution."
          fi

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: ./analytics-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ./analytics-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Flake8
        continue-on-error: true
        run: flake8 .

  security:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./analytics-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ./analytics-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Bandit (SAST)
        run: bandit -r . -iii -x ./venv

      - name: Trivy filesystem scan (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./analytics-service
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f ./analytics-service/docker/Dockerfile \
            -t ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            ./analytics-service

      - name: Container vulnerability scan
        env:
          IMAGE_TAG: ${{ github.sha }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Tag image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

  update-gitops:
    name: Update image tag in GitOps repo
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          fetch-depth: 0

      - name: Setup yq
        uses: mikefarah/yq@v4.44.3

      - name: Bump image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          yq -i '.image.tag = strenv(IMAGE_TAG)' "${{ env.VALUES_PATH }}"

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${{ env.VALUES_PATH }}"
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "ci: bump analytics-service image tag to ${IMAGE_TAG}"
          git pull --rebase origin main
          git push